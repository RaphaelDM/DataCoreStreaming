{% extends "base.html" %}
{% block title %}Connexion client — Olist{% endblock %}
{% block content %}
<section class="narrow-section">
  <form class="form-card" action="/connexion" method="post">
    <p class="eyebrow">HEUREUX DE VOUS REVOIR</p>
    <h1>Connexion client</h1>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button button-dark button-wide" type="submit">Se connecter</button>
    <p class="form-note">Pas encore de compte ? <a href="/inscription">Créer un compte</a></p>
  </form>
</section>
{% endblock %}
