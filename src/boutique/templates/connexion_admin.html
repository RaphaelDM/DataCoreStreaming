{% extends "base.html" %}
{% block title %}Espace administrateur — Olist{% endblock %}
{% block content %}
<section class="narrow-section">
  <form class="form-card admin-card" action="/admin/connexion" method="post">
    <p class="eyebrow">ACCÈS RESTREINT</p>
    <h1>Espace administrateur</h1>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button button-dark button-wide" type="submit">Accéder au dashboard</button>
  </form>
</section>
{% endblock %}
